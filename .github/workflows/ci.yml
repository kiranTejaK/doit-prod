name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_NAME: "DOit CI"
  POSTGRES_SERVER: "localhost"
  POSTGRES_PORT: 5432
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "doit_test"
  FIRST_SUPERUSER: "admin@doit.com"
  FIRST_SUPERUSER_PASSWORD: "password1234"
  SMTP_HOST: "smtp.example.com"
  EMAILS_FROM_EMAIL: "admin@doit.com"
  ENVIRONMENT: "local"

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and backend dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv pip install --system ruff mypy pytest -e .

      - name: Run Ruff Lint
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests/

  migration-checks:
    name: Database Migration Symmetry & Fresh DB Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: doit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and migration dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv pip install --system alembic psycopg[binary] sqlalchemy sqlmodel pydantic pydantic-settings -e .

      - name: Verify Single Alembic Head
        run: |
          cd backend
          HEAD_COUNT=$(alembic heads | wc -l)
          echo "Discovered heads: $HEAD_COUNT"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Error: Multiple migration heads detected!"
            alembic heads
            exit 1
          fi

      - name: Run Alembic Upgrade to Head on Fresh DB
        run: |
          cd backend
          alembic upgrade head

      - name: Test Migration Symmetry (Downgrade and Re-upgrade)
        run: |
          cd backend
          alembic downgrade -1
          alembic upgrade head

  frontend-checks:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Biome Lint Check
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript & Vite Build
        run: |
          cd frontend
          npm run build
